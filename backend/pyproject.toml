[project]
name = "qroute"
version = "0.1.0"
description = "Hybrid RAPTOR + QAOA evacuation routing (Qiskit hackathon POC)"
authors = [
    { name = "Muhammad Abdur Rafey", email = "115175167+MARafey@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.5",
    "numpy>=2.5.4",
    "qiskit>=2.6.2",
    "qiskit-aer>=0.18.2",
    "scipy>=1.18.1",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.9.21,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "pytest>=9.2.0",
    "python-docx>=1.2.0",
]

[project.scripts]
qroute-demo = "qroute.run_demo:main"
qroute-report = "qroute.final_report:main"
qroute-server = "qroute.server:main"
qroute-regions = "qroute.region_runs:main"
qroute-cases = "qroute.cases:main"
qroute-bench = "qroute.bench_ws:main"
qroute-qubits = "qroute.qubit_study:main"
qroute-tsplib = "qroute.tsplib_bench:main"
